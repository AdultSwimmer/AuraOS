<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AuraOS</title>
  <style>
    :root {
      --bg: #0c0c0f;
      --surface: #141418;
      --border: #2a2a32;
      --text: #e0ddd6;
      --dim: #6b6b78;
      --accent: #c8a96e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: Georgia, serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 {
      font-size: 1.1rem;
      font-weight: normal;
      letter-spacing: 0.08em;
      color: var(--accent);
    }
    #status {
      font-size: 0.75rem;
      color: var(--dim);
      font-family: monospace;
    }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }
    .msg { max-width: 42rem; }
    .msg .role {
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--dim);
      margin-bottom: 0.25rem;
      font-family: monospace;
    }
    .msg.aura .role { color: var(--accent); }
    .msg .content {
      line-height: 1.65;
      white-space: pre-wrap;
    }
    footer {
      border-top: 1px solid var(--border);
      padding: 1rem 1.5rem;
      display: flex;
      gap: 0.75rem;
    }
    #input {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.75rem 1rem;
      font-family: Georgia, serif;
      font-size: 1rem;
      outline: none;
      resize: none;
    }
    #input:focus { border-color: var(--accent); }
    button {
      background: var(--accent);
      color: #0c0c0f;
      border: none;
      padding: 0 1.25rem;
      font-family: monospace;
      font-size: 0.8rem;
      letter-spacing: 0.06em;
      cursor: pointer;
    }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
  </style>
</head>
<body>
  <header>
    <h1>AuraOS</h1>
    <div id="status">connecting…</div>
  </header>

  <div id="messages"></div>

  <footer>
    <textarea id="input" rows="1" placeholder="Message…" autofocus></textarea>
    <button id="send">Send</button>
  </footer>

  <script>
    const messagesEl = document.getElementById("messages");
    const inputEl = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const statusEl = document.getElementById("status");

    const userId = localStorage.getItem("aura_user_id") || "default";

    async function checkHealth() {
      try {
        const res = await fetch("/health");
        const data = await res.json();
        statusEl.textContent = data.status === "ok"
          ? `model: ${data.model}`
          : "offline";
      } catch {
        statusEl.textContent = "offline";
      }
    }

    function appendMessage(role, text) {
      const div = document.createElement("div");
      div.className = `msg ${role}`;
      div.innerHTML = `
        <div class="role">${role === "user" ? "You" : "Aura"}</div>
        <div class="content"></div>
      `;
      div.querySelector(".content").textContent = text;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    async function send() {
      const text = inputEl.value.trim();
      if (!text) return;

      inputEl.value = "";
      sendBtn.disabled = true;
      appendMessage("user", text);

      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text, user_id: userId }),
        });
        const data = await res.json();
        if (data.reply) {
          appendMessage("aura", data.reply);
        } else {
          appendMessage("aura", data.error || "No reply");
        }
      } catch (err) {
        appendMessage("aura", "Connection error");
      }

      sendBtn.disabled = false;
      inputEl.focus();
    }

    sendBtn.addEventListener("click", send);
    inputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    });

    checkHealth();
  </script>
</body>
</html>
